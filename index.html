<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>報名表單</title>
  <style>
    body {
      background-color: #001f3f; /* 深藍科技感 */
      font-family: "標楷體", serif;
      color: black;
      font-size: 20px;
      padding: 20px;
    }

    form {
      background-color: white;
      border: 2px solid #00ffff;
      border-radius: 10px;
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid black;
      width: 14.28%;
      height: 60px;
      text-align: center;
      cursor: pointer;
      font-size: 18px;
    }

    td.disabled {
      background-color: #ccc;
      pointer-events: none;
      color: #666;
    }

    td.selected {
      background-color: #00ffff;
      color: black;
    }

    label, input[type="text"] {
      font-size: 20px;
    }

    .meal-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 10px 0;
    }

    #submitButton {
      margin-top: 20px;
      font-size: 20px;
      padding: 10px 20px;
      background-color: #001f3f;
      color: white;
      border: 2px solid #00ffff;
      border-radius: 5px;
      cursor: pointer;
    }

    #submitButton:hover {
      background-color: #004080;
    }
  </style>
</head>
<body>

<h2>請填寫姓名並選擇日期</h2>

<form action="https://docs.google.com/forms/d/e/1FAIpQLSfdKrmBACXy83OvA74N1ssOHnZ2PxqvfhCa2ySAiDO3Ze9KoA/formResponse" method="POST" target="_self" onsubmit="updateFormData()">
  <label for="name">姓名：</label>
  <input type="text" name="entry.1311578602" id="name" required><br><br>

  <!-- 訂餐選項 -->
  <div class="meal-row">
    <label>是否訂餐：</label>
    <label><input type="radio" name="mealChoice" value="訂餐" id="mealChoiceYes" onchange="toggleMealOptions(true)" required> 訂餐</label>
    <label><input type="radio" name="mealChoice" value="不訂餐" id="mealChoiceNo" onchange="toggleMealOptions(false)"> 不訂餐</label>
  </div>

  <!-- 日期選擇 -->
  <table>
    <thead>
      <tr>
        <th>週一</th>
        <th>週二</th>
        <th>週三</th>
        <th>週四</th>
        <th>週五</th>
        <th>週六</th>
        <th>週日</th>
      </tr>
    </thead>
    <tbody id="calendar-body"></tbody>
  </table>

  <div>
    <strong>已選擇：</strong><span id="count">0</span> 天
  </div>

  <input type="hidden" name="entry.1547040468" id="selectedDatesInput"> <!-- 日期字串 -->
  <input type="hidden" name="entry.1144432548" id="selectedDaysCount"> <!-- 選擇天數 -->
  <input type="hidden" name="entry.288196216" id="mealChoiceOutput"> <!-- 是否訂餐 -->

  <button type="submit" id="submitButton">送出</button>
</form>

<script>
  const disabledDates = ['2025-06-20']; // 禁用日期
  const selectedDates = new Set();
  const countDisplay = document.getElementById('count');
  const selectedDaysCountInput = document.getElementById('selectedDaysCount');
  const mealChoiceOutput = document.getElementById('mealChoiceOutput');
  const calendarBody = document.getElementById('calendar-body');
  const startDate = new Date("2025-05-19");
  const endDate = new Date("2025-06-30");

  let row = document.createElement('tr');
  const startDay = (startDate.getDay() + 6) % 7;

  for (let i = 0; i < startDay; i++) {
    row.appendChild(document.createElement('td'));
  }

  for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
    const cell = document.createElement('td');
    const year = d.getFullYear();
    const month = d.getMonth() + 1;
    const day = d.getDate();
    const isoDate = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const displayDate = `${month}/${day}`;
    cell.textContent = displayDate;
    cell.dataset.date = displayDate;

    const isSunday = d.getDay() === 0;
    const isDisabled = isSunday || disabledDates.includes(isoDate);
    if (isDisabled) {
      cell.classList.add('disabled');
      cell.title = "這天不可選";
    }

    cell.addEventListener('click', () => {
      if (document.getElementById('mealChoiceNo').checked || isDisabled) return;
      if (cell.classList.contains('selected')) {
        cell.classList.remove('selected');
        selectedDates.delete(cell.dataset.date);
      } else {
        cell.classList.add('selected');
        selectedDates.add(cell.dataset.date);
      }
      countDisplay.textContent = selectedDates.size;
    });

    row.appendChild(cell);
    if ((d.getDay() + 6) % 7 === 6) {
      calendarBody.appendChild(row);
      row = document.createElement('tr');
    }
  }

  if (row.children.length > 0) {
    while (row.children.length < 7) {
      row.appendChild(document.createElement('td'));
    }
    calendarBody.appendChild(row);
  }

  function updateFormData() {
    document.getElementById('selectedDatesInput').value = Array.from(selectedDates).join(', ');
    selectedDaysCountInput.value = selectedDates.size;
    const mealYes = document.getElementById('mealChoiceYes').checked;
    const mealNo = document.getElementById('mealChoiceNo').checked;
    mealChoiceOutput.value = mealYes ? "訂餐" : mealNo ? "不訂餐" : "";
  }

  function toggleMealOptions(isMealSelected) {
    const calendarCells = document.querySelectorAll('td:not(.disabled)');
    if (isMealSelected) {
      calendarCells.forEach(cell => cell.style.pointerEvents = 'auto');
    } else {
      calendarCells.forEach(cell => {
        cell.style.pointerEvents = 'none';
        cell.classList.remove('selected');
      });
      selectedDates.clear();
      countDisplay.textContent = selectedDates.size;
    }
  }

  // 預設禁用日期選擇
  toggleMealOptions(false);
</script>

</body>
</html>
