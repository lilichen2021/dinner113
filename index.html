<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>訂餐表</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'DFKai-SB', "標楷體", serif;
      background: #0d1b2a;
      margin: 0;
      padding: 2rem;
      color: #2133C;
    }
    h2 {
      text-align: center;
      color: #2133C;
    }
   form {
  background-color: #1b263b;
  border-radius: 15px;
  padding: 2rem;
  max-width: 800px;
  margin: auto;
  box-shadow: 0 0 15px #00f0ff, 0 0 30px #00f0ff44;
  border: 1px solid #00f0ff;
  transition: box-shadow 0.3s ease;
}

td:hover:not(.disabled) {
  box-shadow: inset 0 0 10px #00f0ff, 0 0 8px #00f0ff;
  transition: 0.2s;
}

td.selected {
  background-color: #00f0ff;
  color: #000;
  box-shadow: inset 0 0 10px #00f0ff, 0 0 10px #00f0ff;
}

button {
  background-color: transparent;
  color: #00f0ff;
  border: 2px solid #00f0ff;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 1rem;
  cursor: pointer;
  margin-top: 1rem;
  width: 100%;
  box-shadow: 0 0 8px #00f0ff;
  transition: 0.3s;
}

button:hover {
  background-color: #00f0ff;
  color: #000;
  box-shadow: 0 0 15px #00f0ff;
}
  
    label {
      font-weight: bold;
    }
    input[type="text"] {
      padding: 8px;
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 5px;
      margin-bottom: 20px;
    }
    input[type="radio"] {
      margin-right: 5px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 1rem;
    }
    th, td {
      border: 1px solid #ccc;
      width: 14.28%;
      height: 60px;
      text-align: center;
      vertical-align: middle;
      cursor: pointer;
      position: relative;
    }
    td.disabled {
      background-color: #f5f5f5;
      color: #aaa;
      pointer-events: none;
      cursor: not-allowed;
    }
    td.disabled::after {
      content: attr(data-tooltip);
      position: absolute;
      top: -1.5em;
      left: 50%;
      transform: translateX(-50%);
      background: #999;
      color: #fff;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      display: none;
    }
    td.disabled:hover::after {
      display: block;
    }
    td.selected {
      background-color: #c5dfff;
    }
    button {
      padding: 10px 20px;
      background: #a2c1f2;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:hover {
      background: #7da9e4;
    }
  </style>
</head>
<body>

<h2>請填寫姓名與選擇用餐日期</h2>

<form action="https://docs.google.com/forms/d/e/1FAIpQLSfdKrmBACXy83OvA74N1ssOHnZ2PxqvfhCa2ySAiDO3Ze9KoA/formResponse" method="POST" target="_self" onsubmit="updateFormData()">
  <label for="name">姓名：</label>
  <input type="text" name="entry.1311578602" id="name" required>

  <label>是否訂餐：</label><br>
  <input type="radio" name="entry.288196216" value="訂餐" id="mealChoiceYes" onchange="toggleMealOptions(true)"> 訂餐
  <input type="radio" name="entry.288196216" value="不訂餐" id="mealChoiceNo" onchange="toggleMealOptions(false)"> 不訂餐

  <table>
    <thead>
      <tr>
        <th>週一</th>
        <th>週二</th>
        <th>週三</th>
        <th>週四</th>
        <th>週五</th>
        <th>週六</th>
        <th>週日</th>
      </tr>
    </thead>
    <tbody id="calendar-body"></tbody>
  </table>

  <div><strong>已選擇：</strong><span id="count">0</span> 天</div>

  <input type="hidden" name="entry.1547040468" id="selectedDatesInput">
  <input type="hidden" name="entry.1144432548" id="selectedDaysCount">

  <button type="submit">送出</button>
</form>

<script>
  const selectedDates = new Set();
  const countDisplay = document.getElementById('count');
  const selectedDaysCountInput = document.getElementById('selectedDaysCount');
  const calendarBody = document.getElementById('calendar-body');
  const startDate = new Date("2025-04-30");
  const endDate = new Date("2025-05-31");

  const disabledDates = new Set(["5/10"]);

  function formatDateDisplay(date) {
    return `${date.getMonth() + 1}/${date.getDate()}`;
  }

  const startDay = (startDate.getDay() + 6) % 7;
  let row = document.createElement('tr');
  for (let i = 0; i < startDay; i++) {
    row.appendChild(document.createElement('td'));
  }

  for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
    const cell = document.createElement('td');
    const displayDate = formatDateDisplay(d);
    cell.textContent = d.getDate();
    cell.dataset.date = displayDate;

    const isSunday = d.getDay() === 0;
    const isDisabled = isSunday || disabledDates.has(displayDate);
    if (isDisabled) {
      cell.classList.add('disabled');
      cell.dataset.tooltip = "這天不可選";
    } else {
      cell.addEventListener('click', () => {
        if (document.getElementById('mealChoiceNo').checked) return;
        cell.classList.toggle('selected');
        if (selectedDates.has(displayDate)) {
          selectedDates.delete(displayDate);
        } else {
          selectedDates.add(displayDate);
        }
        countDisplay.textContent = selectedDates.size;
      });
    }

    row.appendChild(cell);
    if ((d.getDay() + 6) % 7 === 6) {
      calendarBody.appendChild(row);
      row = document.createElement('tr');
    }
  }

  if (row.children.length > 0) {
    while (row.children.length < 7) {
      row.appendChild(document.createElement('td'));
    }
    calendarBody.appendChild(row);
  }

  function updateFormData() {
    document.getElementById('selectedDatesInput').value = Array.from(selectedDates).join(', ');
    selectedDaysCountInput.value = selectedDates.size;
  }

  function toggleMealOptions(isMealSelected) {
    const cells = document.querySelectorAll('#calendar-body td:not(.disabled)');
    if (isMealSelected) {
      cells.forEach(cell => cell.style.pointerEvents = 'auto');
    } else {
      cells.forEach(cell => {
        cell.style.pointerEvents = 'none';
        cell.classList.remove('selected');
      });
      selectedDates.clear();
      countDisplay.textContent = "0";
    }
  }

  // 預設為禁用
  toggleMealOptions(false);
</script>

</body>
</html>
